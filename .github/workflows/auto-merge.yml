name: Enable auto-merge

on:
  pull_request:
    # "edited" covers retargeting to another base branch. No branch filter here: a PR
    # moved away from main must still trigger this workflow so auto-merge is turned off.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]

permissions:
  contents: write
  pull-requests: write

# One run per PR; a newer event (e.g. a retarget) cancels any run still in flight.
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    # Fork PRs get a read-only token and can never be auto-merged.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Enable or disable auto-merge from the PR's current state
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Re-read the PR now instead of trusting the event snapshot, which may be stale.
          pr=$(gh pr view "$PR_URL" --json state,baseRefName,isDraft,isCrossRepository,autoMergeRequest)
          eligible=$(jq -r --arg main "$DEFAULT_BRANCH" \
            '.state == "OPEN" and .baseRefName == $main and (.isDraft | not) and (.isCrossRepository | not)' <<<"$pr")
          auto_on=$(jq -r '.autoMergeRequest != null' <<<"$pr")
          echo "current: $(jq -c '{state, baseRefName, isDraft, isCrossRepository}' <<<"$pr") eligible=$eligible auto_merge=$auto_on"

          if [ "$eligible" = "true" ]; then
            # main is protected by the protect-main ruleset, so this queues the merge
            # until the required checks and approval are in place.
            gh pr merge --auto --squash "$PR_URL"
          elif [ "$auto_on" = "true" ]; then
            gh pr merge --disable-auto "$PR_URL"
          else
            echo "Not eligible for auto-merge; nothing to do."
          fi
