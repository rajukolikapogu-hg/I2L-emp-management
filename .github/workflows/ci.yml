name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Throwaway values for CI only. The real SESSION_SECRET lives in the deployment, never in git.
env:
  DATABASE_URL: file:../data/ci.db
  SESSION_SECRET: ci-only-secret-ci-only-secret-0123456789
  COOKIE_SECURE: "false"

jobs:
  # Job IDs must stay exactly "checks" and "e2e": the protect-main ruleset requires those names.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Merge gate for CLAUDE.md "Automation testing (TestSprite)": a PR that changes src/ or
  # prisma/ must also update the committed TestSprite report, and that report must show
  # every test case as passed.
  testsprite-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPORT: testsprite_tests/testsprite-mcp-test-report.md
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an updated, all-passing TestSprite report for app changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          if ! grep -qE '^(src|prisma)/' <<<"$changed"; then
            echo "No changes under src/ or prisma/; TestSprite report not required."
            exit 0
          fi
          if ! grep -qxF "$REPORT" <<<"$changed"; then
            echo "::error file=$REPORT::This PR changes src/ or prisma/ but does not update $REPORT. Run TestSprite as described in CLAUDE.md and commit the report."
            exit 1
          fi

          # Each test case in the report has a line like "- **Status:** ✅ Passed"
          # (other values: "❌ Failed", "⚠️ Partial").
          statuses=$(grep -E '^- \*\*Status:\*\*' "$REPORT" || true)
          total=$(grep -c . <<<"$statuses" || true)
          passed=$(grep -cE 'Status:\*\* ✅ Passed' <<<"$statuses" || true)
          echo "TestSprite report: $passed of $total test cases passed."
          if [ "$total" -eq 0 ]; then
            echo "::error file=$REPORT::No test case statuses found in $REPORT."
            exit 1
          fi
          if [ "$passed" -ne "$total" ]; then
            echo "::error file=$REPORT::$((total - passed)) TestSprite test case(s) did not pass:"
            awk '/^#### Test/ { t = $0 } /^- \*\*Status:\*\*/ && !/✅ Passed/ { print "  " t " -> " $0 }' "$REPORT"
            exit 1
          fi
