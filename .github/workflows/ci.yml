name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Throwaway values for CI only. The real SESSION_SECRET lives in the deployment, never in git.
env:
  DATABASE_URL: file:../data/ci.db
  SESSION_SECRET: ci-only-secret-ci-only-secret-0123456789
  COOKIE_SECURE: "false"

jobs:
  # Job IDs must stay exactly "checks" and "e2e": the protect-main ruleset requires those names.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Merge gate for CLAUDE.md "Automation testing (TestSprite)": a PR that changes src/ or
  # prisma/ must also update the committed TestSprite report under testsprite_tests/.
  testsprite-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an updated TestSprite report for app changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          app_changes=$(grep -E '^(src|prisma)/' <<<"$changed" || true)
          report_changes=$(grep -E '^testsprite_tests/' <<<"$changed" | grep -v '^testsprite_tests/tmp/' || true)

          if [ -z "$app_changes" ]; then
            echo "No changes under src/ or prisma/; TestSprite report not required."
            exit 0
          fi
          if [ -z "$report_changes" ]; then
            echo "::error::This PR changes src/ or prisma/ but does not update testsprite_tests/. Run TestSprite as described in CLAUDE.md and commit the report."
            exit 1
          fi
          echo "TestSprite files updated:"; echo "$report_changes" | sed 's/^/  /'
